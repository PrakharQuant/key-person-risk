name: Weekly Refresh
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: make all
      - name: Commit outputs
        run: |
          git config user.name "kpr-bot"
          git config user.email "kpr-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Weekly data refresh"
          git push
