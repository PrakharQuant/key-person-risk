[project]
name = "key-person-risk"
version = "0.1.0"
description = "Sectoral Key Person Risk Index (KPRI)"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "tqdm>=4.66",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
